<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Startup Scout</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <img src="icons/icon48.png" alt="Logo" class="logo">
        <h1 class="app-title">AI Startup Scout</h1>
      </div>
      <div class="header-right">
        <button id="langToggle" class="icon-btn lang-btn" title="Switch Language">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
          </svg>
          <span class="lang-label">EN</span>
        </button>
        <button id="favToggle" class="icon-btn" title="Favorites">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Search Container -->
    <div id="searchContainer">
      <!-- Search Input -->
      <div class="search-box">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" class="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="Search AI startups...">
        <button id="searchBtn" class="search-btn" data-i18n-title="search" title="Search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>

      <!-- Category Tabs -->
      <div class="category-tabs">
        <button class="category-tab active" data-category="all" data-i18n="catAll">All</button>
        <button class="category-tab" data-category="funding" data-i18n="catFunding">Funding</button>
        <button class="category-tab" data-category="product" data-i18n="catProduct">Product</button>
        <button class="category-tab" data-category="opensource" data-i18n="catOpenSource">Open Source</button>
        <button class="category-tab" data-category="model" data-i18n="catModel">Model</button>
      </div>
    </div>

    <!-- Result Count -->
    <div id="resultCount" class="result-count"></div>

    <!-- Loading -->
    <div id="loading" class="loading" style="display:none;">
      <div class="pulse"></div>
      <span data-i18n="searching">Searching...</span>
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="empty-state">
      <div class="empty-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="1">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
      </div>
      <p class="empty-title" data-i18n="emptyTitle">Discover AI Startups</p>
      <p class="empty-desc" data-i18n="emptyDesc">Search for the latest AI startup projects, funding, and trends</p>
    </div>

    <!-- Results -->
    <div id="results" class="results"></div>

    <!-- AI Summary Panel -->
    <div id="summaryPanel" class="summary-panel" style="display:none;">
      <div class="summary-header">
        <div class="summary-title">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
          </svg>
          <span data-i18n="aiInsight">AI Insight</span>
        </div>
        <button id="closeSummary" class="close-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="summaryContent" class="summary-content"></div>
    </div>

    <!-- Bottom Action Bar -->
    <div class="bottom-bar">
      <button id="analyzeBtn" class="analyze-btn" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
        <span data-i18n="aiAnalyze">AI Analyze</span>
      </button>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
