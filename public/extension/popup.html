<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Startup Scout</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <svg class="logo" width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#6366F1" opacity="0.8"/>
          <path d="M2 17L12 22L22 17" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 12L12 17L22 12" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="header-title">AI Startup Scout</span>
      </div>
      <button class="icon-btn" id="favToggle" title="收藏夹">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
        </svg>
      </button>
    </header>

    <!-- Search Section -->
    <div class="search-section">
      <div class="search-bar">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索 AI 创业项目..." autocomplete="off">
        <button class="search-btn" id="searchBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
      <div class="category-tabs">
        <button class="tab active" data-category="all">全部</button>
        <button class="tab" data-category="funding">融资</button>
        <button class="tab" data-category="product">产品</button>
        <button class="tab" data-category="opensource">开源</button>
        <button class="tab" data-category="model">模型</button>
      </div>
    </div>

    <!-- Results Area -->
    <div class="results-area" id="resultsArea">
      <!-- Initial state -->
      <div class="empty-state" id="emptyState">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
          <path d="M12 2L2 7L12 12L22 7L12 2Z"/>
          <path d="M2 17L12 22L22 17"/>
          <path d="M2 12L12 17L22 12"/>
        </svg>
        <p class="empty-title">发现下一个 AI 独角兽</p>
        <p class="empty-desc">输入关键词搜索 AI 创业项目</p>
      </div>

      <!-- Loading state -->
      <div class="loading-state" id="loadingState" style="display:none;">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>

      <!-- Search results -->
      <div class="results-list" id="resultsList" style="display:none;"></div>

      <!-- Favorites view -->
      <div class="favorites-list" id="favoritesList" style="display:none;"></div>
    </div>

    <!-- AI Summary Section -->
    <div class="summary-section" id="summarySection" style="display:none;">
      <div class="summary-header">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/>
          <path d="M9 21h6M10 17v4M14 17v4"/>
        </svg>
        <span>AI 洞察</span>
        <button class="icon-btn small" id="closeSummary" title="关闭">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <div class="summary-content" id="summaryContent"></div>
    </div>

    <!-- Bottom Bar -->
    <div class="bottom-bar">
      <button class="action-btn" id="analyzeBtn" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a7 7 0 0 1 7 7c0 2.38-1.19 4.47-3 5.74V17a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v-2.26C6.19 13.47 5 11.38 5 9a7 7 0 0 1 7-7z"/>
        </svg>
        <span>AI 分析</span>
      </button>
      <span class="result-count" id="resultCount"></span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
